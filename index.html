<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Šah vs Stockfish</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { background: #0f0c29; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: sans-serif; }
        #board { width: 400px; }
        .highlight-last-move { background-color: rgba(255, 255, 0, 0.4) !important; }
    </style>
</head>
<body>

    <h1>Šah vs Stockfish</h1>
    <div id="board"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var game = new Chess();
        // Ovdje koristimo točno ime fajla koje imaš na GitHubu!
        var stockfish = new Worker('stockfish-18.js'); 
        
        var board = Chessboard('board', {
            position: 'start',
            draggable: false, // Klik sistem
            pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/{piece}.png'
        });

        var selectedSquare = null;

        $('#board').on('click', '.square-55d63', function() {
            var square = $(this).attr('data-square');
            
            if (selectedSquare) {
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) {
                    board.position(game.fen());
                    updateLastMoveHighlight(move);
                    stockfish.postMessage('position fen ' + game.fen());
                    stockfish.postMessage('go depth 15');
                }
                selectedSquare = null;
            } else {
                var p = game.get(square);
                if (p && p.color === 'w') {
                    selectedSquare = square;
                }
            }
        });

        stockfish.onmessage = function(e) {
            var msg = e.data;
            if (msg.startsWith('bestmove')) {
                var m = msg.split(' ')[1];
                var move = game.move({ from: m.substring(0,2), to: m.substring(2,4), promotion: 'q' });
                if (move) {
                    board.position(game.fen());
                    updateLastMoveHighlight(move);
                }
            }
        };

        function updateLastMoveHighlight(move) {
            $('.square-55d63').removeClass('highlight-last-move');
            $('[data-square="' + move.from + '"]').addClass('highlight-last-move');
            $('[data-square="' + move.to + '"]').addClass('highlight-last-move');
        }
    </script>
</body>
</html>
