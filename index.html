<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Sah (by Alan Catovic)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; padding: 20px; }
        #board { width: 500px; max-width: 95vw; border: 5px solid #34495e; }
        .info { margin-top: 20px; font-size: 1.5rem; }
    </style>
</head>
<body>

    <h1>Sah (by Alan Catovic)</h1>
    <div id="board"></div>
    <div class="info" id="status">Pomiči figure klikom</div>

    <audio id="move-snd" src="https://images.chesscomfiles.com/chess-themes/sounds/_standard/default/move-self.mp3"></audio>
    <audio id="win-snd" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var game = new Chess();
        var board = Chessboard('board', {
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        var selectedSquare = null;

        $('#board').on('click', '.square-55d63', function() {
            var square = $(this).attr('data-square');

            if (selectedSquare) {
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) {
                    board.position(game.fen());
                    document.getElementById('move-snd').play();
                    
                    if (game.game_over()) {
                        document.getElementById('win-snd').play();
                        $('#status').text("KRAJ IGRE!");
                    }
                    selectedSquare = null;
                } else {
                    selectedSquare = square;
                }
            } else {
                selectedSquare = square;
            }
        });
    </script>
</body>
</html>
