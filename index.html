<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Šah vs Stockfish</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { background: #0f0c29; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: sans-serif; }
        #board { width: 400px; }
    </style>
</head>
<body>

    <h1>Šah vs Stockfish</h1>
    <div id="board"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var game = new Chess();
        
        // Inicijalizacija ploče
        var board = Chessboard('board', {
            position: 'start',
            pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/{piece}.png'
        });

        // Inicijalizacija Stockfisha (radi samo ako je stranica na GitHub Pages)
        try {
            var stockfish = new Worker('stockfish-18.js');
            stockfish.onmessage = function(e) {
                if (e.data.startsWith('bestmove')) {
                    var m = e.data.split(' ')[1];
                    game.move({ from: m.substring(0,2), to: m.substring(2,4) });
                    board.position(game.fen());
                }
            };
        } catch(e) { console.log("Stockfish nije učitan"); }

        // Klik sistem
        var selected = null;
        $('#board').on('click', '.square-55d63', function() {
            var sq = $(this).attr('data-square');
            if (selected) {
                var m = game.move({ from: selected, to: sq, promotion: 'q' });
                if (m) {
                    board.position(game.fen());
                    stockfish.postMessage('position fen ' + game.fen());
                    stockfish.postMessage('go depth 10');
                }
                selected = null;
            } else {
                var p = game.get(sq);
                if (p && p.color === 'w') selected = sq;
            }
        });
    </script>
</body>
</html>
