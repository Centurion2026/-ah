<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Šah (Profesionalni Stockfish)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #0f0c29; color: #fff; padding: 10px; margin: 0; }
        h1 { font-size: 1.5rem; color: #00d2ff; }
        #board { width: 95vw; max-width: 500px; border: 5px solid #16213e; border-radius: 8px; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        button { padding: 12px; cursor: pointer; background: #1a1a2e; color: white; border: 2px solid #e94560; border-radius: 5px; font-weight: bold; }
        button.active { background: #e94560; }
    </style>
</head>
<body>

    <h1>Šah (Stockfish Engine)</h1>
    <div id="board"></div>

    <div class="controls">
        <button onclick="setSkill(0)">Početnik</button>
        <button onclick="setSkill(10)">Srednji</button>
        <button onclick="setSkill(20)" class="active">Profesionalni</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var game = new Chess();
        var stockfish = new Worker('stockfish.js'); // Povezuje se na tvoj fajl
        
        var board = Chessboard('board', {
            position: 'start',
            draggable: true,
            onDrop: onDrop,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        function onDrop(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            board.position(game.fen());
            
            // Šaljemo potez mašini
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go depth 15'); 
        }

        stockfish.onmessage = function(event) {
            var msg = event.data;
            if (msg.startsWith('bestmove')) {
                var bestMove = msg.split(' ')[1];
                game.move({ from: bestMove.substring(0,2), to: bestMove.substring(2,4) });
                board.position(game.fen());
            }
        };

        function setSkill(level) {
            stockfish.postMessage('setoption name Skill Level value ' + level);
            $('.controls button').removeClass('active');
            $(event.target).addClass('active');
        }
    </script>
</body>
</html>
