<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Šah vs Stockfish</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { background: #0f0c29; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: sans-serif; }
        #board { width: 90vw; max-width: 400px; }
    </style>
</head>
<body>
    
// Ovo radi jer je stockfish.js u istoj mapi na tvom GitHubu
var stockfish = new Worker('stockfish.js');
    <h1>Šah vs Stockfish</h1>
    <div id="board"></div>

    var board = Chessboard('board', {
    position: 'start',
    pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/{piece}.png'
});

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var game = new Chess();
        
        // Inicijalizacija ploče s fiksnom putanjom do slika
        var board = Chessboard('board', {
            position: 'start',
            pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/{piece}.png'
        });

        // Učitavanje Stockfish-a direktno preko Githack CDN-a
        var stockfish = new Worker('https://raw.githack.com/nmrugg/stockfish.js/master/stockfish.js');

        stockfish.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                var m = e.data.split(' ')[1];
                game.move({ from: m.substring(0,2), to: m.substring(2,4) });
                board.position(game.fen());
            }
        };

        // Jednostavan klik za testiranje
        $('#board').on('click', '.square-55d63', function() {
            var sq = $(this).attr('data-square');
            // Logika pomicanja bi išla ovdje
            console.log("Kliknuto polje: " + sq);
        });
    </script>
</body>
</html>
