<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Sah (by Alan Catovic)</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; margin: 0; padding: 20px; }
        h1 { margin-bottom: 10px; color: #ecf0f1; }
        #board { width: 400px; max-width: 90vw; margin: 20px; border: 8px solid #34495e; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .info { margin-top: 10px; font-size: 1.2rem; font-weight: bold; background: #34495e; padding: 10px 20px; border-radius: 20px; }
        button { margin-top: 20px; padding: 12px 25px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; font-size: 1rem; transition: background 0.3s; }
        button:hover { background: #c0392b; }
    </style>
</head>
<body>

    <h1>Sah</h1>
    <p style="margin-top: 0; color: #bdc3c7;">by Alan Catovic</p>
    
    <div id="board"></div>
    
    <div class="info">Status: <span id="status">Bijeli je na potezu</span></div>
    
    <button onclick="resetGame()">Nova igra</button>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' 
            });

            if (move === null) return 'snapback';
            updateStatus();
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            var status = '';
            var moveColor = (game.turn() === 'w') ? 'Bijeli' : 'Crni';

            if (game.in_checkmate()) {
                status = 'KRAJ: ' + moveColor + ' je matiran!';
            } else if (game.in_draw()) {
                status = 'KRAJ: Remi!';
            } else {
                status = moveColor + ' je na potezu';
                if (game.in_check()) {
                    status += ' (ŠAH!)';
                }
            }
            $status.html(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            // OVO POPRAVLJA FIGURE:
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        
        board = ChessBoard('board', config);

        function resetGame() {
            game.reset();
            board.start();
            updateStatus();
        }

        updateStatus();
    </script>
</body>
</html>
