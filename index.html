<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Sah (by Alan Catovic)</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; padding: 20px; }
        #board { width: 400px; max-width: 90vw; border: 5px solid #34495e; border-radius: 5px; }
        .info { margin-top: 15px; background: #34495e; padding: 15px; border-radius: 10px; text-align: center; min-width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .highlight { box-shadow: inset 0 0 3px 3px rgba(255, 255, 0, 0.75); }
        .status-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background: #c0392b; }
        .engine-status { font-size: 0.8rem; color: #bdc3c7; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>Sah</h1>
    <p style="margin-top: -10px; color: #bdc3c7;">by Alan Catovic</p>
    
    <div id="board"></div>
    
    <div class="info">
        <div id="status" class="status-text">Tvoj je red (Bijeli)</div>
        <div id="engine-info" class="engine-status">Stockfish razmišlja...</div>
    </div>
    
    <button onclick="resetGame()">Nova igra</button>

    <audio id="move-sound" src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_move.ogg"></audio>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var moveSound = document.getElementById('move-sound');
        var sourceSquare = null;
        
        // Inicijalizacija Stockfisha (koristimo web worker verziju)
        var stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        
        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight');
        }

        // Funkcija za potez računala
        function makeEngineMove() {
            if (game.game_over()) return;

            $('#engine-info').text('Stockfish razmišlja...');
            
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go depth 12'); // Dubina razmišljanja (podesivo)

            stockfish.onmessage = function(event) {
                if (event.data.startsWith('bestmove')) {
                    var moveMsg = event.data.split(' ');
                    var bestMove = moveMsg[1];
                    
                    game.move({
                        from: bestMove.substring(0, 2),
                        to: bestMove.substring(2, 4),
                        promotion: 'q'
                    });

                    board.position(game.fen());
                    moveSound.play();
                    updateStatus();
                    $('#engine-info').text('Stockfish je odigrao.');
                }
            };
        }

        function onSquareClick(square) {
            if (game.game_over() || game.turn() === 'b') return; // Ne dopusti potez ako je red na crnom (AI)

            if (sourceSquare) {
                var move = game.move({
                    from: sourceSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move === null) {
                    var piece = game.get(square);
                    if (piece && piece.color === 'w') {
                        sourceSquare = square;
                        removeHighlights();
                        $('#board .square-' + square).addClass('highlight');
                    }
                    return;
                }

                board.position(game.fen());
                moveSound.play();
                sourceSquare = null;
                removeHighlights();
                updateStatus();

                // Pozovi Stockfisha nakon tvog poteza
                window.setTimeout(makeEngineMove, 500);
            } else {
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    removeHighlights();
                    $('#board .square-' + square).addClass('highlight');
                }
            }
        }

        function updateStatus() {
            var status = '';
            var moveColor = (game.turn() === 'w') ? 'Bijeli' : 'Crni';

            if (game.in_checkmate()) {
                status = 'KRAJ: ' + (game.turn() === 'w' ? 'Crni (AI)' : 'Bijeli (Ti)') + ' pobjeđuje!';
            } else if (game.in_draw()) {
                status = 'KRAJ: Remi!';
            } else {
                status = (game.turn() === 'w') ? 'Tvoj red (Bijeli)' : 'Stockfish razmišlja...';
                if (game.in_check()) status += ' - ŠAH!';
            }
            $('#status').html(status);
        }

        var config = {
            position: 'start',
            draggable: false,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        board = ChessBoard('board', config);

        $('#board').on('click', '.square-55d63', function() {
            var square = $(this).data('square');
            onSquareClick(square);
        });

        function resetGame() {
            game.reset();
            board.start();
            sourceSquare = null;
            removeHighlights();
            updateStatus();
            $('#engine-info').text('Nova igra započeta.');
        }

        updateStatus();
        $('#engine-info').text('Spreman za igru.');
    </script>
</body>
</html>
