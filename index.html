<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Sah (by Alan Catovic)</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; padding: 20px; }
        #board { width: 400px; max-width: 90vw; border: 5px solid #34495e; }
        .info { margin-top: 15px; background: #34495e; padding: 15px; border-radius: 10px; text-align: center; min-width: 300px; }
        .highlight { box-shadow: inset 0 0 3px 3px yellow; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Sah</h1>
    <p>by Alan Catovic</p>
    
    <div id="board"></div>
    
    <div class="info">
        <div id="status">Bijeli je na potezu</div>
    </div>
    
    <button onclick="resetGame()">Nova igra</button>

    <audio id="move-sound" src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_move.ogg"></audio>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var moveSound = document.getElementById('move-sound');
        var sourceSquare = null;

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight');
        }

        function onSquareClick(square) {
            // Ako već imamo odabranu figuru (izvor)
            if (sourceSquare) {
                var move = game.move({
                    from: sourceSquare,
                    to: square,
                    promotion: 'q'
                });

                // Ako je potez nelegalan, pokušaj promijeniti selekciju na novu figuru
                if (move === null) {
                    sourceSquare = square;
                    removeHighlights();
                    $('#board .square-' + square).addClass('highlight');
                    return;
                }

                // Potez je uspio
                board.position(game.fen());
                moveSound.play();
                sourceSquare = null;
                removeHighlights();
                updateStatus();
            } else {
                // Prvi klik - odabir figure
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square;
                    removeHighlights();
                    $('#board .square-' + square).addClass('highlight');
                }
            }
        }

        function updateStatus() {
            var status = '';
            var moveColor = (game.turn() === 'w') ? 'Bijeli' : 'Crni';

            if (game.in_checkmate()) {
                status = 'MAT! Pobjeda za ' + (game.turn() === 'w' ? 'Crnog' : 'Bijelog');
            } else if (game.in_draw()) {
                status = 'REMI!';
            } else {
                status = moveColor + ' je na potezu';
                if (game.in_check()) status += ' (ŠAH)';
            }
            $('#status').html(status);
        }

        var config = {
            position: 'start',
            draggable: false, // Isključujemo povlačenje jer koristimo klik
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        board = ChessBoard('board', config);

        // Dodavanje event listenera za klik na polja
        $('#board').on('click', '.square-55d63', function() {
            var square = $(this).data('square');
            onSquareClick(square);
        });

        function resetGame() {
            game.reset();
            board.start();
            sourceSquare = null;
            removeHighlights();
            updateStatus();
        }
    </script>
</body>
</html>
