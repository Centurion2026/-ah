<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Sah (by Alan Catovic)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; padding: 20px; }
        /* Povećana tabla */
        #board { width: 500px; max-width: 95vw; border: 5px solid #34495e; }
        .info-box { background: #34495e; padding: 20px; border-radius: 10px; text-align: center; width: 500px; max-width: 95vw; margin-top: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; margin: 5px; }
        button.active { background: #27ae60; }
        .music-btn { background: #f1c40f; color: #333; }
    </style>
</head>
<body>

    <h1>Sah (by Alan Catovic)</h1>
    <div id="board"></div>
    
    <div class="info-box">
        <div id="status" style="font-size: 1.3rem; margin-bottom: 10px;">Bijeli na potezu</div>
        <button class="music-btn" onclick="toggleMusic()">🎵 Pokreni Sevdah</button>
        <div style="margin-top: 10px;">
            <button onclick="setDifficulty(1)" id="btn1">Lako</button>
            <button onclick="setDifficulty(2)" id="btn2" class="active">Srednje</button>
            <button onclick="setDifficulty(3)" id="btn3">Teško</button>
        </div>
    </div>
    <button onclick="resetGame()" style="background:#7f8c8d; margin-top:10px;">Nova igra</button>

    <audio id="move-sound" src="https://images.chesscomfiles.com/chess-themes/sounds/_standard/default/move-self.mp3"></audio>
    <audio id="bg-music" loop src="https://archive.org/download/sevdah-muzika-iz-bosne/Sevdah.mp3"></audio>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var difficulty = 2;

        function toggleMusic() {
            var music = document.getElementById('bg-music');
            if (music.paused) music.play();
            else music.pause();
        }

        function playMoveSound() {
            var sound = document.getElementById('move-sound');
            sound.currentTime = 0;
            sound.play();
        }

        function setDifficulty(lvl) {
            difficulty = lvl;
            $('.info-box button').removeClass('active');
            $('#btn' + lvl).addClass('active');
        }

        function onSquareClick(square) {
            if (game.game_over() || game.turn() === 'b') return;
            // ... (logika za potez ostaje ista)
            var move = game.move({ from: sourceSquare || square, to: square, promotion: 'q' });
            if (move) {
                board.position(game.fen());
                playMoveSound(); // ZVUK SE OVDJE OKIDA
                updateStatus();
                window.setTimeout(makeAiMove, 500);
            } else {
                sourceSquare = square;
            }
        }

        // ... (ostatak koda za makeAiMove, updateStatus i resetGame)
        function makeAiMove() {
            var moves = game.moves();
            if (moves.length > 0) {
                game.move(moves[0]);
                board.position(game.fen());
                playMoveSound();
                updateStatus();
            }
        }

        function updateStatus() {
            $('#status').text(game.turn() === 'w' ? 'Tvoj red (Bijeli)' : 'AI razmišlja...');
        }

        board = Chessboard('board', {
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        $('#board').on('click', '.square-55d63', function() {
            onSquareClick($(this).attr('data-square'));
        });
    </script>
</body>
</html>
