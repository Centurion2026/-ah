<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Šah vs Stockfish</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { background: #0f0c29; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        #board { width: 95vw; max-width: 500px; border: 5px solid #16213e; }
        /* Stil za označavanje zadnjeg poteza */
        .highlight-last-move { background-color: rgba(255, 255, 0, 0.4) !important; }
        .controls { margin-top: 15px; }
    </style>
</head>
<body>

    <h1>Šah vs Stockfish</h1>
    <div id="board"></div>

    <div class="controls">
        <button onclick="setSkill(0)">Početnik</button>
        <button onclick="setSkill(20)">Profesionalac</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var game = new Chess();
        var stockfish = new Worker('stockfish.js');
        var board = Chessboard('board', { position: 'start', draggable: false });
        var selectedSquare = null;

        // Klik sistem (izaberi pa pomakni)
        $('#board').on('click', '.square-55d63', function() {
            var square = $(this).attr('data-square');
            
            if (selectedSquare) {
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) {
                    updateBoard(move);
                    setTimeout(askStockfish, 500);
                }
                selectedSquare = null;
                $('.square-55d63').removeClass('highlight-selected');
            } else {
                var p = game.get(square);
                if (p && p.color === 'w') {
                    selectedSquare = square;
                    $(this).addClass('highlight-selected');
                }
            }
        });

        function askStockfish() {
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go depth 15');
        }

        stockfish.onmessage = function(e) {
            var msg = e.data;
            if (msg.startsWith('bestmove')) {
                var m = msg.split(' ')[1];
                var move = game.move({ from: m.substring(0,2), to: m.substring(2,4), promotion: 'q' });
                updateBoard(move);
            }
        };

        function updateBoard(move) {
            board.position(game.fen());
            $('.square-55d63').removeClass('highlight-last-move');
            $('[data-square="' + move.from + '"]').addClass('highlight-last-move');
            $('[data-square="' + move.to + '"]').addClass('highlight-last-move');
        }

        function setSkill(lvl) { stockfish.postMessage('setoption name Skill Level value ' + lvl); }
    </script>
</body>
</html>
