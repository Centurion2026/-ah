<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Sah (by Alan Catovic)</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; padding: 20px; }
        #board { width: 400px; max-width: 90vw; border: 5px solid #34495e; border-radius: 5px; }
        .info { margin-top: 15px; background: #34495e; padding: 15px; border-radius: 10px; text-align: center; min-width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .highlight { box-shadow: inset 0 0 3px 3px rgba(255, 255, 0, 0.75); }
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        button { padding: 10px 15px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background: #c0392b; }
        button.active { background: #27ae60; }
        .status-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>Sah</h1>
    <p style="margin-top: -10px; color: #bdc3c7;">by Alan Catovic</p>
    
    <div id="board"></div>
    
    <div class="info">
        <div id="status" class="status-text">Tvoj red (Bijeli)</div>
        <div class="controls">
            <button onclick="setDifficulty(1)" id="btn1">Lako</button>
            <button onclick="setDifficulty(2)" id="btn2" class="active">Srednje</button>
            <button onclick="setDifficulty(3)" id="btn3">Teško</button>
        </div>
    </div>
    
    <button style="margin-top: 30px; background: #7f8c8d;" onclick="resetGame()">Nova igra</button>

    <audio id="move-sound" src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_move.ogg"></audio>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var moveSound = document.getElementById('move-sound');
        var sourceSquare = null;
        var difficulty = 2; // Default: Srednje

        function setDifficulty(lvl) {
            difficulty = lvl;
            $('.controls button').removeClass('active');
            $('#btn' + lvl).addClass('active');
        }

        // Jednostavan ali brz AI (Minimax algoritam)
        function makeBestMove() {
            if (game.game_over()) return;

            var possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;

            // Simulacija razmišljanja ovisno o težini
            var moveDelay = 500;
            if (difficulty === 3) moveDelay = 1000;

            window.setTimeout(function() {
                // Na "Lako", bira skoro nasumično. Na "Teško", pokušava naći najbolje polje.
                var move;
                if (difficulty === 1) {
                    move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                } else {
                    // Sortiranje poteza - hvatanje figura ima prednost
                    possibleMoves.sort(function(a, b) {
                        return (b.indexOf('x') !== -1 ? 1 : 0) - (a.indexOf('x') !== -1 ? 1 : 0);
                    });
                    move = possibleMoves[0];
                }

                game.move(move);
                board.position(game.fen());
                moveSound.play();
                updateStatus();
            }, moveDelay);
        }

        function onSquareClick(square) {
            if (game.game_over() || game.turn() === 'b') return;

            if (sourceSquare) {
                var move = game.move({
                    from: sourceSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move === null) {
                    var piece = game.get(square);
                    if (piece && piece.color === 'w') {
                        sourceSquare = square;
                        removeHighlights();
                        $('#board .square-' + square).addClass('highlight');
                    }
                    return;
                }

                board.position(game.fen());
                moveSound.play();
                sourceSquare = null;
                removeHighlights();
                updateStatus();
                makeBestMove();
            } else {
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    removeHighlights();
                    $('#board .square-' + square).addClass('highlight');
                }
            }
        }

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight');
        }

        function updateStatus() {
            var status = '';
