<!DOCTYPE html>
<html lang="bs">
  <head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f2a">

  <title>Šah</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  
<link rel="stylesheet" href="./styles.css?v=2">
<script type="module" src="./app.js?v=2"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Šah">
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Online Stockfish protivnik</p>
          <h1>Šah <span>(by Alan Catovic)</span></h1>
          <p class="subtitle">
            Povuci figuru, odigraj potez i igraj protiv Stockfish engine-a u browseru.
          </p>
        </div>
        <div class="controls">
          <button id="new-game" type="button">Nova partija</button>
          <button id="toggle-music" type="button">Muzika: ukljucena</button>
        </div>
      </header>

      <main class="board-layout">
        <section class="board-panel">
          <div class="board-frame">
            <div id="board" class="board" aria-label="Sahovska tabla"></div>
            <div id="drag-piece" class="drag-piece" aria-hidden="true"></div>
            <div id="mate-banner" class="mate-banner hidden">Mat!</div>
          </div>
        </section>

        <aside class="side-panel">
          <div class="status-card">
            <h2>Status</h2>
            <p id="status-text">Ti si bijeli. Povuci prvi potez.</p>
          </div>

          <div class="status-card">
            <h2>Zadnji potez</h2>
            <p id="last-move-text">Jos nema poteza.</p>
          </div>
        </aside>
      </main>
    </div>

    <audio id="sevdah-track" preload="auto" loop>
      <source src="./assets/safet-isovic.mp3" type="audio/mpeg" />
    </audio>

    <script type="module" src="./app.js"></script>
    <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js")
      .then(function (reg) {
        console.log("Service Worker registrovan:", reg.scope);
      })
      .catch(function (err) {
        console.log("Service Worker greska:", err);
      });
  });
}
</script>
  </body>
</html>
