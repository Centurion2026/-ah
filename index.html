<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Moja Šahovska Aplikacija</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; }
        #board { width: 400px; margin: 20px; border: 5px solid #34495e; }
        .info { margin-top: 10px; font-size: 1.2rem; }
        button { padding: 10px 20px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Šah Protiv Sebe (ili prijatelja)</h2>
    <div id="board"></div>
    <div class="info">Status: <span id="status">Bijeli je na potezu</span></div>
    <br>
    <button onclick="resetGame()">Nova igra</button>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        function onDragStart (source, piece, position, orientation) {
            // Ne dopusti pomicanje ako je igra gotova
            if (game.game_over()) return false;

            // Dopusti pomicanje samo figura onoga tko je na redu
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            // Provjeri je li potez legalan
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Uvijek promovira u kraljicu radi jednostavnosti
            });

            // Ako je potez nelegalan, vrati figuru nazad
            if (move === null) return 'snapback';

            updateStatus();
        }

        function onSnapEnd () {
            // Ažuriraj poziciju ploče nakon što animacija završi (bitno za en passant, rokadu...)
            board.position(game.fen());
        }

        function updateStatus () {
            var status = '';
            var moveColor = (game.turn() === 'w') ? 'Bijeli' : 'Crni';

            if (game.in_checkmate()) {
                status = 'Igra gotova, ' + moveColor + ' je matiran!';
            } else if (game.in_draw()) {
                status = 'Igra gotova, remi!';
            } else {
                status = moveColor + ' je na potezu';
                if (game.in_check()) {
                    status += ', ŠAH!';
                }
            }

            $status.html(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        board = ChessBoard('board', config);

        function resetGame() {
            game.reset();
            board.start();
            updateStatus();
        }

        updateStatus();
    </script>
</body>
</html>
